<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Driver - Sagara Daily Checkup</title>
</head>

<body>

    <header>
        <h1>Sagara Daily Checkup</h1>

        <nav>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>

        <article>
            <h2>Login Driver</h2>

            <p>Silakan masuk menggunakan akun driver untuk mengakses sistem.</p>

            <form action="index.html">

                <p>
                    <label for="username">Username</label><br>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >
                </p>

                <p>
                    <label for="password">Password</label><br>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                </p>

                <button type="submit">Login</button>

            </form>
        </article>

    </main>

    <footer>
        <p>Sagara Daily Checkup</p>
    </footer>

</body>
</html>
