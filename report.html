<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - Sagara Daily Checkup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Sagara Daily Checkup</h1>

    <nav>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="report.html">Buat Laporan</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>
</header>

<main>

    <article>
        <h2>Buat Laporan Kerusakan</h2>

        <div class="info-box">
            <p>Isi data kendaraan dan kerusakan yang ditemukan.</p>
        </div>

        <form action="index.html" method="get">

            <label for="vehicle">Merek Kendaraan</label>
            <input type="text" id="vehicle" name="vehicle">

            <label for="plate">Nomor Kendaraan</label>
            <input type="text" id="plate" name="plate">

            <label for="issue">Jenis Kerusakan</label>
            <select id="issue" name="issue">
                <option value="">-- Pilih Kerusakan --</option>
                <option value="ban">Ban</option>
                <option value="rem">Rem</option>
                <option value="mesin">Mesin</option>
                <option value="lampu">Lampu</option>
                <option value="lainnya">Lainnya</option>
            </select>

            <label for="description">Deskripsi Kerusakan</label>
            <textarea id="description" name="description" rows="5"></textarea>

            <label for="photo">Foto Kerusakan</label>
            <input type="file" id="photo" name="photo">

            <button type="submit">Kirim Laporan</button>

        </form>
    </article>

</main>

<footer>
    <p>Sagara Daily Checkup &copy; 2026</p>
</footer>

</body>
</html>
